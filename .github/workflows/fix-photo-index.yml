name: Fix Cached Photo Index

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-photo-index.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch photo loader
        run: python .github/fix_photo.py

      - name: Commit repair
        run: |
          rm -f .github/workflows/fix-photo-index.yml .github/fix_photo.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-photo-index.yml .github/fix_photo.py
          git commit -m "Fix cached automatic property photo loading"
          git push
