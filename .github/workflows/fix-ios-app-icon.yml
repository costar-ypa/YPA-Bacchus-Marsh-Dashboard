name: Fix iPhone app icon
on:
  push:
    paths:
      - scripts/fix-ios-app-icon.py
      - .github/workflows/fix-ios-app-icon.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point iOS to dedicated app icon
        run: python scripts/fix-ios-app-icon.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix iPhone YPA home screen icon'
          git push
