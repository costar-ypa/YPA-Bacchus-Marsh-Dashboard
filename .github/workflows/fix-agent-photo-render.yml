name: Fix Agent Photo Render

on:
  push:
    paths:
      - '.github/workflows/fix-agent-photo-render.yml'
      - 'scripts/fix-agent-photo-render.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch agent photo markup
        run: python scripts/fix-agent-photo-render.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Fix agent profile photo rendering"
            git push
          fi
