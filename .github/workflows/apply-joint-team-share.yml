name: Apply Joint Team Share
on:
  push:
    paths:
      - 'scripts/apply-joint-team-share.py'
      - '.github/workflows/apply-joint-team-share.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply update
        run: python3 scripts/apply-joint-team-share.py
      - name: Commit update
        run: |
          rm -f .github/workflows/apply-joint-team-share.yml
          rm -f scripts/apply-joint-team-share.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-joint-team-share.yml scripts/apply-joint-team-share.py
          git commit -m "Make site joint Bacchus Marsh Melton team experience"
          git push
