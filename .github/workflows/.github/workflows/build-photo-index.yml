name: Build Property Photo Index

on:
  push:
    paths:
      - "images/**"
      - ".github/workflows/build-photo-index.yml"

permissions:
  contents: write

jobs:
  build-photo-index:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build photo index
        shell: python
        run: |

          import json
          from pathlib import Path

          root = Path("images")
          output = root / "photo-index.json"

          allowed = {
              ".jpg",
              ".jpeg",
              ".png",
              ".webp"
          }

          index = {}

          if root.exists():

              for folder in sorted(root.iterdir()):

                  if not folder.is_dir():
                      continue

                  files = sorted(
                      [
                          f.name
                          for f in folder.iterdir()
                          if f.is_file()
                          and f.suffix.lower() in allowed
                      ]
                  )

                  if files:
                      index[folder.name] = files

          output.write_text(
              json.dumps(
                  index,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              json.dumps(
                  index,
                  indent=2
              )
          )

      - name: Commit photo index
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images/photo-index.json

          if git diff --cached --quiet; then
            echo "No changes to photo index."
            exit 0
          fi

          git commit -m "Update property photo index"
          git push
