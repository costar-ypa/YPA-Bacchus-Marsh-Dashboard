name: Add site icons
on:
  push:
    paths:
      - scripts/add-site-icons.py
      - .github/workflows/add-site-icons.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add favicon and web app metadata
        run: python scripts/add-site-icons.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Add YPA favicon and web app branding'
          git push
