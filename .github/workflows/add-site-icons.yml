name: Add site icons
on:
  push:
    paths:
      - scripts/fix-pwa-icons.py
      - .github/workflows/add-site-icons.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Rebuild iOS and PWA icons from verified source
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path('apple-touch-icon.png')
          im=Image.open(src).convert('RGB')
          im.resize((180,180),Image.Resampling.LANCZOS).save('apple-touch-icon-v5.png')
          im.resize((192,192),Image.Resampling.LANCZOS).save('images/ypa-app-icon-v5-192.png')
          im.resize((512,512),Image.Resampling.LANCZOS).save('images/ypa-app-icon-v5-512.png')
          PY
          python scripts/fix-pwa-icons.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html site-v5.webmanifest apple-touch-icon-v5.png images/ypa-app-icon-v5-192.png images/ypa-app-icon-v5-512.png
          git diff --cached --quiet || git commit -m 'Publish fresh iPhone home screen icons'
          git push
