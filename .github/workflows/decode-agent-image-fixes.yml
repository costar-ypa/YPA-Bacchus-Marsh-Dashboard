name: Decode Agent Image Fixes

on:
  push:
    branches: [main]
    paths:
      - 'images/agents/*-fixed.b64'
      - 'scripts/decode-agent-image-fixes.py'
      - '.github/workflows/decode-agent-image-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode corrected agent images
        run: python scripts/decode-agent-image-fixes.py
      - name: Commit corrected images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/agents
          if git diff --cached --quiet; then
            echo "No staged image fixes"
          else
            git commit -m "Replace broken agent portrait files"
            git push
          fi
