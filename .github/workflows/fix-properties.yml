name: Restore Property Rendering

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-properties.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore last known working property renderer and add robust photo matching
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          good = "c3cd604ed5f60f2f350f7a04bc75322d431671f1"
          html = subprocess.check_output(["git", "show", f"{good}:index.html"], text=True)

          marker = "</script>"
          insert = r'''

/* =========================================================
   AUTOMATIC GITHUB PROPERTY PHOTO MATCHING
========================================================= */

let githubImageIndex = null;
let githubImageIndexPromise = null;

function normalisePhotoText(value){
    return String(value || "")
        .toLowerCase()
        .replace(/&/g, "and")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
}

function getPropertyPhotoFolder(h){
    const address = String(h.address || "").trim();
    const suburb = String(h.suburb || "").trim();
    return normalisePhotoText(`${address} ${suburb}`);
}

async function buildGithubImageIndex(){
    if(githubImageIndex) return githubImageIndex;
    if(githubImageIndexPromise) return githubImageIndexPromise;

    githubImageIndexPromise = (async () => {
        try{
            const url =
                "https://api.github.com/repos/costar-ypa/YPA-Bacchus-Marsh-Dashboard/git/trees/main?recursive=1";
            const response = await fetch(url);
            if(!response.ok){
                throw new Error(`GitHub returned ${response.status}`);
            }

            const data = await response.json();
            const index = {};
            const validExtensions = ["jpg", "jpeg", "png", "webp"];

            (data.tree || []).forEach(file => {
                if(file.type !== "blob") return;

                const path = String(file.path || "");
                if(!path.toLowerCase().startsWith("images/")) return;

                const parts = path.split("/");
                if(parts.length < 3) return;

                const extension = path.split(".").pop().toLowerCase();
                if(!validExtensions.includes(extension)) return;

                const folder = normalisePhotoText(parts[1]);
                if(!index[folder]) index[folder] = [];

                const imageUrl =
                    `https://costar-ypa.github.io/YPA-Bacchus-Marsh-Dashboard/${parts
                        .map(part => encodeURIComponent(part))
                        .join("/")}`;

                index[folder].push(imageUrl);
            });

            Object.keys(index).forEach(folder => {
                index[folder].sort((a,b) =>
                    a.localeCompare(b, undefined, {numeric:true, sensitivity:"base"})
                );
            });

            githubImageIndex = index;
            return githubImageIndex;
        }catch(error){
            console.error("Could not load GitHub property photos:", error);
            githubImageIndex = {};
            return githubImageIndex;
        }
    })();

    return githubImageIndexPromise;
}

getLocalPhotos = async function(h){
    const index = await buildGithubImageIndex();
    const folder = getPropertyPhotoFolder(h);
    return index[folder] || [];
};
'''

          if marker not in html:
              raise SystemExit("Could not locate closing script tag")

          html = html.rsplit(marker, 1)[0] + insert + "\n" + marker + html.rsplit(marker, 1)[1]
          Path("index.html").write_text(html, encoding="utf-8")

      - name: Commit recovery and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-properties.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-properties.yml
          git commit -m "Restore property rendering with automatic photo matching"
          git push
