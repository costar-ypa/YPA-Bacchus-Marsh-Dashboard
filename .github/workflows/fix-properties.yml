name: Restore Property Rendering

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-properties.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known working dashboard
        run: |
          git show c3cd604ed5f60f2f350f7a04bc75322d431671f1:index.html > index.html

      - name: Commit recovery
        run: |
          rm -f .github/workflows/fix-properties.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-properties.yml
          git commit -m "Restore working property rendering"
          git push
