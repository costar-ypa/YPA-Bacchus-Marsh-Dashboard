name: Final Photo Cache Fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/final-photo-fix.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final photo cache fix
        run: python .github/scripts/final_photo_fix.py

      - name: Commit fix
        run: |
          rm -f .github/workflows/final-photo-fix.yml .github/scripts/final_photo_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/final-photo-fix.yml .github/scripts/final_photo_fix.py
          git commit -m "Fix final property photo cache override"
          git push
