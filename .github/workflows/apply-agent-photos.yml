name: Apply Agent Photos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-agent-photos.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply agent photos
        run: python scripts/patch-agent-photos.py
      - name: Commit changes
        run: |
          rm -f .github/workflows/apply-agent-photos.yml scripts/patch-agent-photos.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-agent-photos.yml scripts/patch-agent-photos.py
          git commit -m "Add agent photos to team directory"
          git push
