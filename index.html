<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071b3a"><link rel="manifest" href="manifest.webmanifest"><title>YPA Bacchus Marsh | Open Homes</title><style>:root{--n:#071b3a;--y:#f5c400;--g:#087443;--r:#c51f2b}*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#10213d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{background:linear-gradient(145deg,var(--n),#0d2a52);color:#fff;padding:22px 18px 18px;position:sticky;top:0;z-index:20}.wrap{max-width:1050px;margin:auto}.brand{font-size:12px;font-weight:900;letter-spacing:.12em}.title{font-size:30px;font-weight:900;margin-top:4px}.sub,.clock{font-size:12px;opacity:.78;margin-top:6px}.headerrow{display:flex;justify-content:space-between;gap:15px}.share{border:1px solid #ffffff40;background:#ffffff15;color:#fff;border-radius:12px;padding:10px 13px;font-weight:800;height:max-content}nav{position:sticky;top:119px;z-index:15;background:#fff;border-bottom:1px solid #e5e9ef;padding:10px 14px;display:flex;gap:8px;overflow:auto}nav button{border:0;background:#edf1f5;padding:10px 16px;border-radius:999px;font-weight:800;white-space:nowrap}nav button.active{background:var(--y);color:var(--n)}main{padding:18px 14px 50px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}.stat{background:#fff;border-radius:16px;padding:15px}.stat b{display:block;font-size:24px}.stat span{font-size:10px;color:#667487;font-weight:900}.search{width:100%;padding:13px 14px;border:1px solid #e5e9ef;border-radius:14px;font-size:16px;margin-bottom:12px}.cards{display:grid;gap:12px}.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 4px 20px #0000000c}.photo{height:180px;background:linear-gradient(135deg,#dfe5ec,#f7f8fa);display:flex;align-items:center;justify-content:center;color:#8390a0;font-weight:800}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:17px}.topline{display:flex;justify-content:space-between;gap:10px}.time{font-size:22px;font-weight:900}.date{font-size:12px;color:#667487;font-weight:800}.badge{font-size:10px;font-weight:900;padding:7px 9px;border-radius:999px;background:#edf1f5}.badge.live{background:#ffe5e7;color:var(--r)}.badge.next{background:#e5f5ec;color:var(--g)}.address{font-size:20px;font-weight:900;margin:15px 0 7px}.price{font-weight:900}.meta{display:flex;gap:14px;margin-top:9px;color:#526174}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.actions a,.actions button{border:0;border-radius:11px;padding:12px;background:var(--n);color:#fff;font-weight:900;text-align:center;text-decoration:none}.actions .secondary{background:#edf1f5;color:var(--n)}.agent{font-size:12px;color:#667487;margin-top:10px}.empty,.error{background:#fff;border-radius:18px;padding:50px 20px;text-align:center;color:#667487}.error{color:#a40000}.sync{text-align:center;color:#667487;font-size:11px;margin-top:15px}.fab{position:fixed;right:18px;bottom:18px;border:0;border-radius:50%;background:var(--y);color:var(--n);width:58px;height:58px;font-size:22px;font-weight:900;z-index:30}@media(min-width:700px){.cards{grid-template-columns:1fr 1fr}.photo{height:210px}}</style></head><body><header><div class="wrap headerrow"><div><div class="brand">YPA ESTATE AGENTS · BACCHUS MARSH</div><div class="title">Open Homes</div><div class="sub">Your local guide to upcoming inspections</div><div class="clock" id="clock"></div></div><button class="share" id="share">Share</button></div></header><nav id="tabs"><button class="active" data-v="today">Today</button><button data-v="tomorrow">Tomorrow</button><button data-v="week">This Week</button><button id="my">My Open Homes</button></nav><main class="wrap"><input id="search" class="search" placeholder="Search suburb or address…"><div class="summary"><div class="stat"><b id="total">—</b><span>OPEN HOMES</span></div><div class="stat"><b id="next">—</b><span>NEXT OPEN</span></div><div class="stat"><b id="count">—</b><span>COUNTDOWN</span></div></div><div id="app"><div class="empty">Loading open homes…</div></div><div id="sync" class="sync"></div></main><button class="fab" id="plan">✓</button><script>const API_URL='PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE',TZ='Australia/Melbourne';let events=[],view='today',q='',myOnly=false,sel=new Set(JSON.parse(localStorage.getItem('ypa_plan')||'[]')),nextEvent=null;const $=x=>document.getElementById(x);function p(){return new Intl.DateTimeFormat('en-AU',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date()).reduce((o,x)=>(o[x.type]=x.value,o),{})}function now(){let x=p();return{date:`${x.year}-${x.month}-${x.day}`,time:`${x.hour}:${x.minute}`}}function mins(s){let m=(s||'').toUpperCase().replace(/\s/g,''),pm=m.endsWith('PM'),am=m.endsWith('AM');m=m.replace('AM','').replace('PM','');let a=m.split(':'),h=+a[0]||0,mi=+a[1]||0;if(pm&&h<12)h+=12;if(am&&h===12)h=0;return h*60+mi}function date(s){let m=(s||'').match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);return m?`${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`:s}function dt(e,k){return new Date(`${e.date}T${e[k]}:00`)}function expired(e){let n=now();return e.date<n.date||(e.date===n.date&&mins(e.end)<=mins(n.time))}function status(e){let n=now();if(e.date!==n.date)return'UPCOMING';let x=mins(n.time);if(x>=mins(e.start)&&x<mins(e.end))return'LIVE NOW';if(x<mins(e.start))return'NEXT OPEN';return'PAST'}function shift(n){let x=now(),d=new Date(x.date+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function list(){let n=now(),a=events.filter(e=>!expired(e));if(view==='today')a=a.filter(e=>e.date===n.date);if(view==='tomorrow')a=a.filter(e=>e.date===shift(1));if(view==='week')a=a.filter(e=>e.date>=n.date&&e.date<=shift(7));if(q)a=a.filter(e=>(e.address+' '+e.suburb).toLowerCase().includes(q));if(myOnly)a=a.filter(e=>sel.has(e.id));return a.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start))}function render(){let a=list();$('total').textContent=a.length;let all=events.filter(e=>!expired(e)).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));nextEvent=all.find(e=>dt(e,'start')>new Date())||all.find(e=>status(e)==='LIVE NOW');$('next').textContent=nextEvent?.start||'—';if(!a.length){$('app').innerHTML='<div class="empty">No open homes match your selection.</div>';return}$('app').innerHTML='<div class="cards">'+a.map(e=>{let s=status(e),addr=e.suburb?e.address+', '+e.suburb:e.address,rea=e.rea&&/^https?:\/\//i.test(e.rea)?e.rea:'',q=encodeURIComponent(addr);return `<article class="card"><div class="photo">${e.photo?`<img src="${esc(e.photo)}" alt="" loading="lazy">`:'PROPERTY'}</div><div class="body"><div class="topline"><div><div class="time">${esc(e.start)} – ${esc(e.end)}</div><div class="date">${esc(new Date(e.date+'T12:00:00').toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'}))}</div></div><div class="badge ${s==='LIVE NOW'?'live':s==='NEXT OPEN'?'next':''}">${s}</div></div><div class="address">${esc(addr)}</div>${e.price?`<div class="price">${esc(e.price)}</div>`:''}<div class="meta">${e.beds?`<span>🛏 ${esc(e.beds)}</span>`:''}${e.baths?`<span>🛁 ${esc(e.baths)}</span>`:''}</div>${e.agent?`<div class="agent">YPA · ${esc(e.agent)}</div>`:''}<div class="actions"><a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Get Directions</a>${rea?`<a class="secondary" href="${esc(rea)}" target="_blank" rel="noopener">View Property</a>`:`<button class="secondary" onclick="toggle('${esc(e.id)}')">${sel.has(e.id)?'✓ Added to Plan':'Add to My Plan'}</button>`}</div></div></article>`}).join('')+'</div>'}function toggle(id){sel.has(id)?sel.delete(id):sel.add(id);localStorage.setItem('ypa_plan',JSON.stringify([...sel]));render()}async function load(){if(API_URL.includes('PASTE_')){$('app').innerHTML='<div class="error"><b>Secure feed not connected yet.</b><br>The Apps Script web-app URL needs to be added to index.html.</div>';return}try{let r=await fetch(API_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();let d=await r.json();events=(d.events||[]).map((e,i)=>({...e,id:String(e.id||i),date:date(e.date)}));$('sync').textContent='Updated '+new Date().toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'});render()}catch(e){$('app').innerHTML='<div class="error"><b>Open homes are temporarily unavailable.</b><br>Please try again shortly.</div>'}}function tick(){$('clock').textContent=new Intl.DateTimeFormat('en-AU',{timeZone:TZ,weekday:'long',day:'numeric',month:'long',hour:'numeric',minute:'2-digit',second:'2-digit'}).format(new Date())+' · Melbourne';if(nextEvent){let d=Math.max(0,dt(nextEvent,'start')-new Date()),m=Math.floor(d/60000),s=Math.floor(d/1000)%60;$('count').textContent=m?`${m}m ${s}s`:`${s}s`}else $('count').textContent='—';if(events.length)render()}$('search').oninput=e=>{q=e.target.value.toLowerCase().trim();render()};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;myOnly=false;render()});$('my').onclick=()=>{myOnly=!myOnly;$('my').classList.toggle('active',myOnly);render()};$('share').onclick=()=>navigator.share?navigator.share({title:'YPA Bacchus Marsh Open Homes',url:location.href}):navigator.clipboard?.writeText(location.href).then(()=>alert('Link copied.'));$('plan').onclick=()=>{myOnly=true;$('my').classList.add('active');render()};load();tick();setInterval(tick,1000);setInterval(load,300000)</script></body></html>
