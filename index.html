<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YPA Bacchus Marsh | Open Homes</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f5f7;
    color: #071b3a;
}
header {
    background: #071b3a;
    color: white;
    padding: 20px 16px;
}
.header {
    max-width: 1100px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.logo {
    background: #f4c400;
    color: #071b3a;
    font-weight: 900;
    font-size: 20px;
    padding: 12px;
    border-radius: 8px;
}
.title {
    margin-left: 12px;
}
.title h1 {
    margin: 0;
    font-size: 19px;
}
.title p {
    margin: 3px 0 0;
    font-size: 11px;
    opacity: .7;
}
.brand {
    display: flex;
    align-items: center;
}
.clock {
    text-align: right;
}
.clock strong {
    display: block;
    font-size: 17px;
}
.clock small {
    opacity: .7;
}
.controls {
    max-width: 1100px;
    margin: 18px auto 0;
    padding: 0 16px;
}
.buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}
button,
.button {
    border: 0;
    border-radius: 8px;
    padding: 11px 15px;
    font-weight: bold;
    text-decoration: none;
    cursor: pointer;
}
.refresh {
    background: #071b3a;
    color: white;
}
.sheet {
    background: #f4c400;
    color: #071b3a;
}
.status {
    margin-top: 9px;
    color: #697586;
    font-size: 12px;
}
.tabs {
    max-width: 1100px;
    margin: 18px auto 0;
    padding: 0 16px;
    display: flex;
    gap: 8px;
}
.tab {
    background: white;
    color: #071b3a;
}
.tab.active {
    background: #071b3a;
    color: white;
}
main {
    max-width: 1100px;
    margin: 20px auto;
    padding: 0 16px 40px;
}
.heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}
.heading h2 {
    margin: 0;
    font-size: 20px;
}
.count {
    background: #f4c400;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
    gap: 15px;
}
.card {
    background: white;
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,.07);
    border-left: 5px solid #f4c400;
}
.time {
    font-size: 24px;
    font-weight: 900;
}
.until {
    color: #697586;
    font-size: 12px;
}
.address {
    margin-top: 15px;
    font-size: 18px;
    font-weight: 800;
}
.suburb {
    margin-top: 3px;
    color: #697586;
    font-size: 13px;
}
.price {
    margin-top: 13px;
    font-weight: bold;
}
.details {
    display: flex;
    gap: 15px;
    margin-top: 10px;
    font-size: 13px;
}
.card-buttons {
    display: flex;
    gap: 8px;
    margin-top: 17px;
}
.navigate {
    background: #071b3a;
    color: white;
}
.listing {
    background: #f4c400;
    color: #071b3a;
}
.message {
    background: white;
    padding: 30px 20px;
    text-align: center;
    border-radius: 12px;
    color: #697586;
}
.error {
    background: #fff0f0;
    color: #a52c2c;
    padding: 14px;
    border-radius: 9px;
    margin-bottom: 15px;
    font-size: 13px;
}
@media (max-width: 600px) {
    .header {
        align-items: flex-start;
    }
    .title h1 {
        font-size: 16px;
    }
    .clock strong {
        font-size: 14px;
    }
    .clock small {
        font-size: 9px;
    }
    .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>
<header>
    <div class="header">
        <div class="brand">
            <div class="logo">
                YPA
            </div>
            <div class="title">
                <h1>YPA BACCHUS MARSH</h1>
                <p>OPEN HOME DASHBOARD</p>
            </div>
        </div>
        <div class="clock">
            <strong id="clock">--:--</strong>
            <small id="date">Loading...</small>
        </div>
    </div>
</header>
<div class="controls">
    <div class="buttons">
        <button class="refresh" onclick="loadHomes()">
            ↻ Refresh
        </button>
        <a
            class="button sheet"
            href="https://docs.google.com/spreadsheets/d/e/2PACX-1vSuLVcmvHjwZcvZ4VMprmhHdkG-F5983q7Wo8GuzUq0UW0VSQ0WhFnzHnIqcphwpGOVvvffjMaYGLY4/pubhtml"
            target="_blank">
            Open Google Sheet
        </a>
    </div>
    <div class="status" id="status">
        Connecting...
    </div>
</div>
<div class="tabs">
    <button class="tab active" onclick="changeTab('today', this)">
        Today
    </button>
    <button class="tab" onclick="changeTab('tomorrow', this)">
        Tomorrow
    </button>
    <button class="tab" onclick="changeTab('week', this)">
        This Week
    </button>
</div>
<main>
    <div id="error"></div>
    <div class="heading">
        <h2 id="heading">
            Today's Open Homes
        </h2>
        <div class="count" id="count">
            0
        </div>
    </div>
    <div id="homes"></div>
</main>
<script>
/* =====================================================
   GOOGLE SHEET CSV
===================================================== */
const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSuLVcmvHjwZcvZ4VMprmhHdkG-F5983q7Wo8GuzUq0UW0VSQ0WhFnzHnIqcphwpGOVvvffjMaYGLY4/pub?output=csv";
let homes = [];
let activeTab = "today";
/* =====================================================
   CLOCK
===================================================== */
function updateClock() {
    const now = new Date();
    document.getElementById("clock").textContent =
        new Intl.DateTimeFormat("en-AU", {
            timeZone: "Australia/Melbourne",
            hour: "numeric",
            minute: "2-digit",
            second: "2-digit",
            hour12: true
        }).format(now);
    document.getElementById("date").textContent =
        new Intl.DateTimeFormat("en-AU", {
            timeZone: "Australia/Melbourne",
            weekday: "short",
            day: "numeric",
            month: "short"
        }).format(now);
}
setInterval(updateClock, 1000);
updateClock();
/* =====================================================
   CSV PARSER
===================================================== */
function csvParse(text) {
    const rows = [];
    let row = [];
    let value = "";
    let quote = false;
    for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') {
            quote = !quote;
        }
        else if (c === "," && !quote) {
            row.push(value.trim());
            value = "";
        }
        else if ((c === "\n" || c === "\r") && !quote) {
            if (c === "\r" && text[i + 1] === "\n") {
                i++;
            }
            row.push(value.trim());
            if (row.some(x => x !== "")) {
                rows.push(row);
            }
            row = [];
            value = "";
        }
        else {
            value += c;
        }
    }
    if (value || row.length) {
        row.push(value.trim());
        if (row.some(x => x !== "")) {
            rows.push(row);
        }
    }
    return rows;
}
/* =====================================================
   DATE
===================================================== */
function parseDate(value) {
    value = String(value || "").trim();
    let m =
        value.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if (m) {
        return {
            day: Number(m[1]),
            month: Number(m[2]),
            year: Number(m[3])
        };
    }
    m =
        value.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
    if (m) {
        return {
            day: Number(m[3]),
            month: Number(m[2]),
            year: Number(m[1])
        };
    }
    return null;
}
/* =====================================================
   TIME
===================================================== */
function parseTime(value) {
    value = String(value || "")
        .trim()
        .toLowerCase()
        .replace(/\s/g, "");
    const m =
        value.match(/^(\d{1,2})(?::(\d{2}))?(am|pm)?$/);
    if (!m) return null;
    let hour = Number(m[1]);
    let minute = Number(m[2] || 0);
    if (m[3] === "pm" && hour !== 12) {
        hour += 12;
    }
    if (m[3] === "am" && hour === 12) {
        hour = 0;
    }
    return {
        hour,
        minute
    };
}
/* =====================================================
   DATE KEY
===================================================== */
function dateKey(date) {
    return (
        date.year + "-" +
        String(date.month).padStart(2, "0") + "-" +
        String(date.day).padStart(2, "0")
    );
}
/* =====================================================
   MELBOURNE DATE KEY
===================================================== */
function melbourneDateKey(offset = 0) {
    const now = new Date();
    const parts =
        new Intl.DateTimeFormat("en-AU", {
            timeZone: "Australia/Melbourne",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }).formatToParts(now);
    let y, m, d;
    parts.forEach(p => {
        if (p.type === "year") y = Number(p.value);
        if (p.type === "month") m = Number(p.value);
        if (p.type === "day") d = Number(p.value);
    });
    const date = new Date(y, m - 1, d);
    date.setDate(date.getDate() + offset);
    return (
        date.getFullYear() + "-" +
        String(date.getMonth() + 1).padStart(2, "0") + "-" +
        String(date.getDate()).padStart(2, "0")
    );
}
/* =====================================================
   CONVERT SHEET DATE/TIME TO REAL DATE
===================================================== */
function makeDate(date, time) {
    /*
       This produces a Melbourne-local timestamp.
       The dashboard only needs to know whether the
       inspection has finished, so the resulting Date
       is adjusted using Melbourne's actual timezone.
    */
    const text =
        `${date.year}-${String(date.month).padStart(2,"0")}-${String(date.day).padStart(2,"0")}T${String(time.hour).padStart(2,"0")}:${String(time.minute).padStart(2,"0")}:00`;
    /*
       Temporarily calculate using Melbourne timezone
       through Intl.
    */
    const guess = new Date(text + "Z");
    const formatter =
        new Intl.DateTimeFormat("en-AU", {
            timeZone: "Australia/Melbourne",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
        });
    for (let i = 0; i < 3; i++) {
        const parts = {};
        formatter.formatToParts(guess).forEach(p => {
            if (p.type !== "literal") {
                parts[p.type] = Number(p.value);
            }
        });
        const displayed =
            Date.UTC(
                parts.year,
                parts.month - 1,
                parts.day,
                parts.hour,
                parts.minute,
                parts.second
            );
        const wanted =
            Date.UTC(
                date.year,
                date.month - 1,
                date.day,
                time.hour,
                time.minute,
                0
            );
        guess.setTime(
            guess.getTime() + (wanted - displayed)
        );
    }
    return guess;
}
/* =====================================================
   LOAD
===================================================== */
async function loadHomes() {
    const status =
        document.getElementById("status");
    const error =
        document.getElementById("error");
    status.textContent =
        "Refreshing...";
    error.innerHTML = "";
    try {
        const response =
            await fetch(
                CSV_URL + "&v=" + Date.now(),
                {
                    cache: "no-store"
                }
            );
        if (!response.ok) {
            throw new Error(
                "Google Sheet returned HTTP " +
                response.status
            );
        }
        const text =
            await response.text();
        if (
            text.toLowerCase().includes("<html") ||
            text.toLowerCase().includes("sorry, the file")
        ) {
            throw new Error(
                "Google did not return the CSV data."
            );
        }
        const rows =
            csvParse(text);
        if (rows.length < 2) {
            throw new Error(
                "No open home data was found."
            );
        }
        const headers =
            rows[0].map(x =>
                x.toLowerCase().trim()
            );
        const required = [
            "date",
            "start time",
            "end time",
            "address",
            "suburb",
            "price",
            "bedrooms",
            "bathrooms",
            "rea url"
        ];
        const missing =
            required.filter(
                x => !headers.includes(x)
            );
        if (missing.length) {
            throw new Error(
                "Missing columns: " +
                missing.join(", ")
            );
        }
        const col = {};
        headers.forEach((header, i) => {
            col[header] = i;
        });
        homes = [];
        for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            const date =
                parseDate(row[col["date"]]);
            const start =
                parseTime(row[col["start time"]]);
            const end =
                parseTime(row[col["end time"]]);
            const address =
                String(
                    row[col["address"]] || ""
                ).trim();
            if (!date || !start || !end || !address) {
                continue;
            }
            homes.push({
                date,
                dateKey: dateKey(date),
                start,
                end,
                startDate:
                    makeDate(date, start),
                endDate:
                    makeDate(date, end),
                address,
                suburb:
                    String(
                        row[col["suburb"]] || ""
                    ).trim(),
                price:
                    String(
                        row[col["price"]] || ""
                    ).trim(),
                bedrooms:
                    String(
                        row[col["bedrooms"]] || ""
                    ).trim(),
                bathrooms:
                    String(
                        row[col["bathrooms"]] || ""
                    ).trim(),
                rea:
                    String(
                        row[col["rea url"]] || ""
                    ).trim()
            });
        }
        homes.sort(
            (a, b) =>
                a.startDate - b.startDate
        );
        status.textContent =
            "✓ Connected • " +
            homes.length +
            " open homes";
        render();
    }
    catch (e) {
        console.error(e);
        status.textContent =
            "⚠ Unable to sync";
        error.innerHTML =
            "<strong>Google Sheet connection problem</strong><br>" +
            e.message;
        render();
    }
}
/* =====================================================
   CHANGE TAB
===================================================== */
function changeTab(tab, button) {
    activeTab = tab;
    document
        .querySelectorAll(".tab")
        .forEach(x =>
            x.classList.remove("active")
        );
    button.classList.add("active");
    render();
}
/* =====================================================
   FILTER
===================================================== */
function filteredHomes() {
    const now = new Date();
    const today =
        melbourneDateKey(0);
    const tomorrow =
        melbourneDateKey(1);
    return homes.filter(home => {
        /*
           Remove the inspection once its END time
           has passed.
        */
        if (
            home.endDate &&
            now >= home.endDate
        ) {
            return false;
        }
        if (activeTab === "today") {
            return home.dateKey === today;
        }
        if (activeTab === "tomorrow") {
            return home.dateKey === tomorrow;
        }
        if (activeTab === "week") {
            const homeDate =
                new Date(
                    home.date.year,
                    home.date.month - 1,
                    home.date.day
                );
            const todayDate =
                new Date(
                    today.split("-")[0],
                    Number(today.split("-")[1]) - 1,
                    today.split("-")[2]
                );
            const weekDate =
                new Date(todayDate);
            weekDate.setDate(
                weekDate.getDate() + 7
            );
            return (
                homeDate >= todayDate &&
                homeDate < weekDate
            );
        }
        return false;
    });
}
/* =====================================================
   FORMAT TIME
===================================================== */
function displayTime(time) {
    let hour = time.hour;
    const suffix =
        hour >= 12 ? "PM" : "AM";
    hour = hour % 12 || 12;
    return (
        hour +
        ":" +
        String(time.minute).padStart(2, "0") +
        " " +
        suffix
    );
}
/* =====================================================
   ESCAPE HTML
===================================================== */
function safe(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
/* =====================================================
   RENDER
===================================================== */
function render() {
    const container =
        document.getElementById("homes");
    const count =
        document.getElementById("count");
    const heading =
        document.getElementById("heading");
    const list =
        filteredHomes();
    if (activeTab === "today") {
        heading.textContent =
            "Today's Open Homes";
    }
    if (activeTab === "tomorrow") {
        heading.textContent =
            "Tomorrow's Open Homes";
    }
    if (activeTab === "week") {
        heading.textContent =
            "This Week's Open Homes";
    }
    count.textContent =
        list.length;
    if (!list.length) {
        container.innerHTML = `
            <div class="message">
                <strong>No open homes</strong><br>
                There are currently no open homes for this period.
            </div>
        `;
        return;
    }
    container.innerHTML =
        `<div class="grid">` +
        list.map(home => {
            const map =
                "https://www.google.com/maps/search/?api=1&query=" +
                encodeURIComponent(
                    home.address +
                    (home.suburb
                        ? ", " + home.suburb
                        : "") +
                    ", Victoria"
                );
            return `
                <div class="card">
                    <div class="time">
                        ${safe(displayTime(home.start))}
                    </div>
                    <div class="until">
                        Until ${safe(displayTime(home.end))}
                    </div>
                    <div class="address">
                        ${safe(home.address)}
                    </div>
                    ${
                        home.suburb
                        ? `
                            <div class="suburb">
                                ${safe(home.suburb)}
                            </div>
                          `
                        : ""
                    }
                    ${
                        home.price
                        ? `
                            <div class="price">
                                ${safe(home.price)}
                            </div>
                          `
                        : ""
                    }
                    ${
                        home.bedrooms || home.bathrooms
                        ? `
                            <div class="details">
                                ${
                                    home.bedrooms
                                    ? "🛏 " +
                                      safe(home.bedrooms)
                                    : ""
                                }
                                ${
                                    home.bathrooms
                                    ? "🛁 " +
                                      safe(home.bathrooms)
                                    : ""
                                }
                            </div>
                          `
                        : ""
                    }
                    <div class="card-buttons">
                        <a
                            class="button navigate"
                            href="${map}"
                            target="_blank">
                            Navigate
                        </a>
                        ${
                            home.rea
                            ? `
                                <a
                                    class="button listing"
                                    href="${safe(home.rea)}"
                                    target="_blank"
                                    rel="noopener">
                                    View Listing
                                </a>
                              `
                            : ""
                        }
                    </div>
                </div>
            `;
        }).join("") +
        `</div>`;
}
/* =====================================================
   AUTO REFRESH
===================================================== */
/*
   Google Sheet refresh:
   every 5 minutes
*/
setInterval(
    loadHomes,
    300000
);
/*
   Expired homes:
   checked every 30 seconds
*/
setInterval(
    render,
    30000
);
/* =====================================================
   START
===================================================== */
loadHomes();
</script>
</body>
</html>
