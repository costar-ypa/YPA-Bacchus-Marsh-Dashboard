<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071b3a"><link rel="manifest" href="manifest.webmanifest"><title>YPA Open Home Dashboard</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f6f8;color:#10213d}.top{background:#071b3a;color:#fff;padding:24px 18px 18px;position:sticky;top:0;z-index:2}.brand{font-weight:800;letter-spacing:.08em;font-size:13px}.title{font-size:28px;font-weight:800;margin:6px 0}.clock{font-size:14px;opacity:.8}.tabs{display:flex;gap:8px;padding:12px 14px;overflow:auto;background:#fff;position:sticky;top:112px;z-index:1}.tabs button{border:0;border-radius:999px;padding:10px 16px;background:#e9edf2;font-weight:700}.tabs button.active{background:#f5c400;color:#071b3a}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 3px 15px #0000000d}.time{font-size:24px;font-weight:800}.status{font-size:12px;font-weight:800;margin:5px 0 12px}.now{color:#d71920}.next{color:#087443}.meta{display:flex;gap:12px;flex-wrap:wrap;color:#526174;font-size:14px}.addr{font-size:18px;font-weight:750;margin:5px 0 12px}.actions{display:flex;gap:8px;margin-top:14px}.actions a,.actions button{flex:1;text-align:center;text-decoration:none;border:0;border-radius:10px;padding:11px;background:#071b3a;color:#fff;font-weight:700}.empty{text-align:center;padding:50px 20px;color:#687587}.note{font-size:12px;color:#687587;padding:10px 2px}</style></head><body><header class="top"><div class="brand">YPA BACCHUS MARSH</div><div class="title">Open Home Dashboard</div><div id="clock" class="clock"></div></header><nav class="tabs"><button class="active" data-view="today">Today</button><button data-view="tomorrow">Tomorrow</button><button data-view="week">This Week</button></nav><main class="wrap"><div id="app"></div><div class="note">Times are calculated in Australia/Melbourne. Listings are sourced from your connected sheet. REA property details should be supplied through an authorised REA data source/API rather than scraping the public site.</div></main><script>
const SHEET_ID='1vsdwDO64iN2YUnM1f2Byf5Rq-mUzqeGQDs0-F717f3w';
const SHEET_GID='0';
let events=[
['2026-09-02','10:00','10:20','26 Rosehill Drive, Bacchus Marsh'],['2026-09-02','10:40','11:00','3 Chicory Drive, Bacchus Marsh'],['2026-09-02','11:20','11:40','6 Riversdale Crescent, Darley'],['2026-09-02','12:00','12:20','33 Pamela Court, Darley'],['2026-09-02','17:20','17:40','26 Rosehill Drive, Bacchus Marsh'],['2026-09-02','10:00','10:20','25 Light Fingers Street, Kurunjang'],['2026-09-02','10:40','11:00','67 Mercer Street, Harkness'],['2026-09-02','11:20','11:40','17 Merdon Place, Kurunjang'],['2026-09-02','12:00','12:20','4 Regent Place, Melton West'],['2026-09-02','12:40','13:00','30 Moonah Avenue, Brookfield'],['2026-09-02','13:20','13:40','18 Oakpark Drive, Harkness'],['2026-09-02','14:00','14:20','14 Cook Road, Melton South'],['2026-09-02','14:40','15:00','32 Robinson Drive, Weir Views'],['2026-09-02','17:40','18:00','63 Dundas Street, Darley'],['2026-09-03','17:20','17:40','26 Rosehill Drive, Bacchus Marsh'],['2026-09-03','17:40','18:00','9 Johansen Place, Darley'],['2026-09-05','10:00','10:20','6 Candeloro Street, Bacchus Marsh'],['2026-09-05','10:40','11:00','9 Johansen Place, Darley'],['2026-09-05','11:20','11:40','63 Dundas Street, Darley'],['2026-09-05','12:00','12:20','1 Whelan Court, Darley'],['2026-09-05','12:40','13:00','54 Manning Boulevard, Darley']].map(x=>({date:x[0],start:x[1],end:x[2],address:x[3]}));
let view='today';
const tz='Australia/Melbourne';
function mel(){return new Intl.DateTimeFormat('en-AU',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date()).reduce((o,p)=>(o[p.type]=p.value,o),{});}
function nowParts(){const p=mel();return {date:`${p.year}-${p.month}-${p.day}`,time:`${p.hour}:${p.minute}`,iso:`${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}:${p.second}`}}
function mins(s){const [h,m]=s.split(':').map(Number);return h*60+m}
function dateObj(e,which){return new Date(`${e.date}T${which}:00+10:00`)}
function expired(e){const p=nowParts();return e.date<p.date||(e.date===p.date&&mins(e.end)<=mins(p.time))}
function status(e){const p=nowParts();if(e.date!==p.date)return 'UPCOMING';const n=mins(p.time),a=mins(e.start),b=mins(e.end);if(n>=a&&n<b)return 'OPEN NOW';if(n<a)return 'NEXT OPEN';return 'PAST'}
function dateShift(n){const d=new Date(nowParts().date+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function shown(){let arr=events.filter(e=>!expired(e));const today=nowParts().date;if(view==='today')arr=arr.filter(e=>e.date===today);if(view==='tomorrow')arr=arr.filter(e=>e.date===dateShift(1));if(view==='week'){const end=dateShift(7);arr=arr.filter(e=>e.date>=today&&e.date<=end)}return arr.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start))}
function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const arr=shown();const app=document.getElementById('app');if(!arr.length){app.innerHTML='<div class="empty">No open homes remaining for this view.</div>';return}let firstNext=true;app.innerHTML=arr.map(e=>{const st=status(e);let cls=st==='OPEN NOW'?'now':(st==='NEXT OPEN'&&firstNext?'next':'');if(st==='NEXT OPEN')firstNext=false;const dt=new Date(`${e.date}T${e.start}:00`);const dateLabel=new Intl.DateTimeFormat('en-AU',{timeZone:tz,weekday:'short',day:'numeric',month:'short'}).format(dt);const q=encodeURIComponent(e.address);return `<article class="card"><div class="time">${e.start}–${e.end}</div><div class="status ${cls}">${st} · ${dateLabel}</div><div class="addr">${e.address}</div><div class="meta"><span>Price: —</span><span>🛏 —</span><span>🛁 —</span></div><div class="actions"><a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank">Navigate</a><a href="https://www.realestate.com.au/buy/in-${encodeURIComponent(e.address.replaceAll(',',''))}/list-1" target="_blank">REA Search</a></div></article>`}).join('')}
function tick(){const p=nowParts();document.getElementById('clock').textContent=`${new Intl.DateTimeFormat('en-AU',{timeZone:tz,weekday:'long',day:'numeric',month:'long',hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true}).format(new Date())} · Melbourne`;render()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});tick();setInterval(tick,1000);
</script></body></html>
