<body>
<header class="top">
  <div class="brand">
    YPA BACCHUS MARSH
  </div>
  <div class="title">

  </div>

  </div>
  <div class="bar">
<button
  class="refresh"

</button>
<button
  class="source"
  id="source">

</button>
  </div>

    id="sync"
    class="sync">

  </div>
</header>
<nav class="tabs">

Today
Tomorrow
This Week
</nav>
<main class="wrap">
  <div id="app">
<div class="loading">
  Loading open homes…
</div>
  </div>
  <div class="note">
Data is pulled from your published Google Sheet.
Open homes automatically disappear after their scheduled
end time.
  </div>
</main>
<script>
/* =========================================================
   GOOGLE SHEET SETTINGS
========================================================= */
const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSuLVcmvHjwZcvZ4VMprmhHdkG-F5983q7Wo8GuzUq0UW0VSQ0WhFnzHnlqcphwpGOVvvffjMaYGLY4/pub?output=csv";
/*
   This is what opens when you press
   "Google Sheet".
*/
const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSuLVcmvHjwZcvZ4VMprmhHdkG-F5983q7Wo8GuzUq0UW0VSQ0WhFnzHnlqcphwpGOVvvffjMaYGLY4/pubhtml";
const TIMEZONE =
"Australia/Melbourne";
let events = [];
let view = "today";
let lastSync = null;
/* =========================================================
   GET MELBOURNE DATE
========================================================= */
function getMelbourneDate() {
  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone: TIMEZONE,
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }
    ).formatToParts(new Date());
  const result = {};
  parts.forEach(part => {
    if (part.type !== "literal") {
      result[part.type] =
        part.value;
    }
  });
  return (
    result.year +
    "-" +
    result.month +
    "-" +
    result.day
  );
}
/* =========================================================
   ADD DAYS
========================================================= */
function addDays(dateString, amount) {
  const parts =
    dateString
      .split("-")
      .map(Number);
  const date =
    new Date(
      Date.UTC(
        parts[0],
        parts[1] - 1,
        parts[2]
      )
    );
  date.setUTCDate(
    date.getUTCDate() + amount
  );
  return date
    .toISOString()
    .slice(0, 10);
}
/* =========================================================
   GET MELBOURNE TIME
========================================================= */
function getMelbourneMinutes() {
  const parts =
    new Intl.DateTimeFormat(
      "en-AU",
      {
        timeZone: TIMEZONE,
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }
    ).formatToParts(new Date());
  let hour = 0;
  let minute = 0;
  parts.forEach(part => {
    if (part.type === "hour") {
      hour =
        Number(part.value);
    }
    if (part.type === "minute") {
      minute =
        Number(part.value);
    }
  });
  return (
    hour * 60 +
    minute
  );
}
/* =========================================================
   PARSE TIME
========================================================= */
function parseTime(value) {
  if (!value) return null;
  let s =
    String(value)
      .trim()
      .toUpperCase()
      .replace(/\s+/g, "");
  /*
    Supported examples:
    9:00 AM
    9:00AM
    09:00
    14:30
    2 PM
    2:30 PM
  */
  const match =
    s.match(
      /^(\d{1,2})(?::(\d{1,2}))?(AM|PM)?$/
    );
  if (!match) {
    return null;
  }
  let hour =
    Number(match[1]);
  const minute =
    Number(match[2] || 0);
  const modifier =
    match[3];
  if (minute > 59) {
    return null;
  }
  if (
    modifier === "PM" &&
    hour < 12
  ) {
    hour += 12;
  }
  if (
    modifier === "AM" &&
    hour === 12
  ) {
    hour = 0;
  }
  if (hour > 23) {
    return null;
  }
  return (
    hour * 60 +
    minute
  );
}
/* =========================================================
   FORMAT TIME
========================================================= */
function formatTime(minutes) {
  if (
    minutes === null ||
    minutes === undefined
  ) {
    return "";
  }
  const hour24 =
    Math.floor(minutes / 60);
  const minute =
    minutes % 60;
  const suffix =
    hour24 >= 12
      ? "PM"
      : "AM";
  let hour =
    hour24 % 12;
  if (hour === 0) {
    hour = 12;
  }
  return (
    hour +
    ":" +
    String(minute).padStart(2, "0") +
    " " +
    suffix
  );
}
/* =========================================================
   PARSE DATE
========================================================= */
function parseDate(value) {
  if (!value) {
    return "";
  }
  let s =
    String(value)
      .trim()
      .replace(/^\uFEFF/, "")
      .replace(/\s+/g, " ");
  /*
    DD/MM/YYYY
  */
  let match =
    s.match(
      /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/
    );
  if (match) {
    return (
      match[3] +
      "-" +
      String(match[2]).padStart(2, "0") +
      "-" +
      String(match[1]).padStart(2, "0")
    );
  }
  /*
    YYYY-MM-DD
  */
  match =
    s.match(
      /^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/
    );
  if (match) {
    return (
      match[1] +
      "-" +
      String(match[2]).padStart(2, "0") +
      "-" +
      String(match[3]).padStart(2, "0")
    );
  }
  return "";
}
/* =========================================================
   CSV PARSER
========================================================= */
function csvParse(text) {
  const rows = [];
  let row = [];
  let cell = "";
  let quoted = false;
  for (
    let i = 0;
    i < text.length;
    i++
  ) {
    const char =
      text[i];
    if (quoted) {
      if (
        char === '"' &&
        text[i + 1] === '"'
      ) {
        cell += '"';
        i++;
      }
      else if (
        char === '"'
      ) {
        quoted = false;
      }
      else {
        cell += char;
      }
    }
    else {
      if (char === '"') {
        quoted = true;
      }
      else if (char === ",") {
        row.push(cell);
        cell = "";
      }
      else if (char === "\n") {
        row.push(cell);
        rows.push(row);
        row = [];
        cell = "";
      }
      else if (char !== "\r") {
        cell += char;
      }
    }
  }
  if (
    cell !== "" ||
    row.length
  ) {
    row.push(cell);
    rows.push(row);
  }
  return rows;
}
/* =========================================================
   CLEAN VALUE
========================================================= */
function clean(value) {
  return String(value || "")
    .replace(/^\uFEFF/, "")
    .trim();
}
/* =========================================================
   LOAD GOOGLE SHEET
========================================================= */
async function loadCsv() {
  const app =
    document.getElementById("app");
  app.innerHTML =
    '<div class="loading">Refreshing open homes…</div>';
  try {
    const response =
      await fetch(
        CSV_URL +
        "&cache=" +
        Date.now(),
        {
          cache: "no-store",
          redirect: "follow"
        }
      );
    if (!response.ok) {
      throw new Error(
        "Google Sheets returned HTTP " +
        response.status +
        "."
      );
    }
    const text =
      await response.text();
    if (!text || text.length < 5) {
      throw new Error(
        "Google Sheets returned an empty response."
      );
    }
    /*
      Detect if Google is returning
      an HTML page instead of CSV.
    */
    if (
      text
        .toLowerCase()
        .includes("<html") ||
      text
        .toLowerCase()
        .includes("<!doctype")
    ) {
      throw new Error(
        "Google returned a webpage instead of CSV data. Make sure the spreadsheet is published to the web."
      );
    }
    const rows =
      csvParse(text);
    if (!rows.length) {
      throw new Error(
        "The published Google Sheet is empty."
      );
    }
    /*
      READ COLUMN HEADINGS
    */
    const headers =
      rows[0].map(
        heading =>
          clean(heading)
            .toLowerCase()
            .replace(/\s+/g, " ")
      );
    function findColumn(...names) {
      for (
        const name of names
      ) {
        const index =
          headers.indexOf(
            name.toLowerCase()
          );
        if (index >= 0) {
          return index;
        }
      }
      return -1;
    }
    /*
      COLUMN MAPPING
    */
    const columns = {
      date:
        findColumn(
          "date"
        ),
      start:
        findColumn(
          "start time",
          "start",
          "opening time"
        ),
      end:
        findColumn(
          "end time",
          "end",
          "closing time"
        ),
      address:
        findColumn(
          "address",
          "property address"
        ),
      suburb:
        findColumn(
          "suburb",
          "location"
        ),
      price:
        findColumn(
          "price",
          "price guide"
        ),
      beds:
        findColumn(
          "bedrooms",
          "beds"
        ),
      baths:
        findColumn(
          "bathrooms",
          "baths"
        ),
      rea:
        findColumn(
          "rea url",
          "rea",
          "realestate url"
        ),
      agent:
        findColumn(
          "agent",
          "agent name"
        )
    };
    /*
      CHECK REQUIRED COLUMNS
    */
    const missing = [];
    if (columns.date < 0)
      missing.push("Date");
    if (columns.start < 0)
      missing.push("Start Time");
    if (columns.end < 0)
      missing.push("End Time");
    if (columns.address < 0)
      missing.push("Address");
    if (missing.length) {
      throw new Error(
        "Missing required columns: " +
        missing.join(", ") +
        "."
      );
    }
    /*
      CONVERT ROWS TO EVENTS
    */
    events =
      rows
        .slice(1)
        .map(row => {
          const start =
            parseTime(
              clean(
                row[columns.start]
              )
            );
          const end =
            parseTime(
              clean(
                row[columns.end]
              )
            );
          return {
            date:
              parseDate(
                clean(
                  row[columns.date]
                )
              ),
            start:
              start,
            end:
              end,
            address:
              clean(
                row[columns.address]
              ),
            suburb:
              columns.suburb >= 0
                ? clean(
                    row[columns.suburb]
                  )
                : "",
            price:
              columns.price >= 0
                ? clean(
                    row[columns.price]
                  )
                : "",
            beds:
              columns.beds >= 0
                ? clean(
                    row[columns.beds]
                  )
                : "",
            baths:
              columns.baths >= 0
                ? clean(
                    row[columns.baths]
                  )
                : "",
            rea:
              columns.rea >= 0
                ? clean(
                    row[columns.rea]
                  )
                : "",
            agent:
              columns.agent >= 0
                ? clean(
                    row[columns.agent]
                  )
                : ""
          };
        })
        .filter(event =>
          event.date &&
          event.start !== null &&
          event.end !== null &&
          event.address
        );
    lastSync =
      new Date();
    document
      .getElementById("sync")
      .textContent =
        "Synced " +
        lastSync.toLocaleTimeString(
          "en-AU",
          {
            hour: "numeric",
            minute: "2-digit"
          }
        ) +
        " · " +
        events.length +
        " open homes";
    render();
  }
  catch (error) {
    console.error(error);
    app.innerHTML = `
      <div class="error">
        <b>
          Couldn't load the Google Sheet.
        </b>
        <br><br>
        ${escapeHtml(error.message)}
        <br><br>
        <b>
          Required columns:
        </b>
        <br>
        • Date
        <br>
        • Start Time
        <br>
        • End Time
        <br>
        • Address
        <br><br>
        Make sure your Google Sheet is
        published to the web as CSV.
      </div>
    `;
    document
      .getElementById("sync")
      .textContent =
        "Sync failed";
  }
}
/* =========================================================
   EXPIRY CHECK
========================================================= */
function isExpired(event) {
  const today =
    getMelbourneDate();
  /*
    Any previous date is expired.
  */
  if (
    event.date < today
  ) {
    return true;
  }
  /*
    Any future date is not expired.
  */
  if (
    event.date > today
  ) {
    return false;
  }
  /*
    Same day:
    remove once end time is reached.
  */
  const currentMinutes =
    getMelbourneMinutes();
  return (
    event.end <=
    currentMinutes
  );
}
/* =========================================================
   EVENT STATUS
========================================================= */
function getStatus(event) {
  const today =
    getMelbourneDate();
  if (
    event.date !== today
  ) {
    return "UPCOMING";
  }
  const now =
    getMelbourneMinutes();
  if (
    now >= event.start &&
    now < event.end
  ) {
    return "OPEN NOW";
  }
  if (
    now < event.start
  ) {
    return "NEXT OPEN";
  }
  return "PAST";
}
/* =========================================================
   DATE LABEL
========================================================= */
function dateLabel(date) {
  const parts =
    date
      .split("-")
      .map(Number);
  const d =
    new Date(
      parts[0],
      parts[1] - 1,
      parts[2],
      12
    );
  return new Intl.DateTimeFormat(
    "en-AU",
    {
      weekday: "short",
      day: "numeric",
      month: "short"
    }
  ).format(d);
}
/* =========================================================
   FILTER EVENTS
========================================================= */
function getShownEvents() {
  const today =
    getMelbourneDate();
  let list =
    events.filter(
      event =>
        !isExpired(event)
    );
  if (
    view === "today"
  ) {
    list =
      list.filter(
        event =>
          event.date === today
      );
  }
  else if (
    view === "tomorrow"
  ) {
    const tomorrow =
      addDays(today, 1);
    list =
      list.filter(
        event =>
          event.date === tomorrow
      );
  }
  else if (
    view === "week"
  ) {
    const weekEnd =
      addDays(today, 7);
    list =
      list.filter(
        event =>
          event.date >= today &&
          event.date <= weekEnd
      );
  }
  return list.sort(
    (a,b) => {
      if (
        a.date !== b.date
      ) {
        return a.date.localeCompare(
          b.date
        );
      }
      return (
        a.start -
        b.start
      );
    }
  );
}
/* =========================================================
   ESCAPE HTML
========================================================= */
function escapeHtml(value) {
  return String(value || "")
    .replace(
      /[&<>"']/g,
      character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]
    );
}
/* =========================================================
   RENDER DASHBOARD
========================================================= */
function render() {
  /*
    Update tabs.
  */
  document
    .querySelectorAll(
      ".tabs button"
    )
    .forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.view === view
      );
    });
  const list =
    getShownEvents();
  const app =
    document.getElementById("app");
  /*
    Nothing available.
  */
  if (!list.length) {
    app.innerHTML =
      '<div class="empty">No open homes remaining for this view.</div>';
    return;
  }
  let nextFound =
    false;
  let currentDate =
    "";
  let html =
    "";
  list.forEach(event => {
    /*
      Week view headings.
    */
    if (
      view === "week" &&
      event.date !== currentDate
    ) {
      currentDate =
        event.date;
      html += `
        <div class="day-heading">
          ${escapeHtml(
            dateLabel(event.date)
          )}
        </div>
      `;
    }
    const status =
      getStatus(event);
    let statusClass =
      "";
    if (
      status === "OPEN NOW"
    ) {
      statusClass =
        "now";
    }
    if (
      status === "NEXT OPEN" &&
      !nextFound
    ) {
      statusClass =
        "next";
      nextFound =
        true;
    }
    const address =
      event.suburb
        ? event.address +
          ", " +
          event.suburb
        : event.address;
    const mapsUrl =
      "https://www.google.com/maps/search/?api=1&query=" +
      encodeURIComponent(
        address
      );
    let reaUrl = "";
    if (
      event.rea &&
      /^https?:\/\//i.test(
        event.rea
      )
    ) {
      reaUrl =
        event.rea;
    }
    html += `
      <article class="card">
        <div class="time">
          ${formatTime(
            event.start
          )}
          –
          ${formatTime(
            event.end
          )}
        </div>
        <div
          class="status ${statusClass}"
        >
          ${status}
          ·
          ${escapeHtml(
            dateLabel(event.date)
          )}
        </div>
        <div class="addr">
          ${escapeHtml(
            address
          )}
        </div>
        <div class="meta">
          ${
            event.price
              ? `
                <span class="price">
                  ${escapeHtml(
                    event.price
                  )}
                </span>
              `
              : ""
          }
          ${
            event.beds
              ? `
                <span>
                  🛏
                  ${escapeHtml(
                    event.beds
                  )}
                </span>
              `
              : ""
          }
          ${
            event.baths
              ? `
                <span>
                  🛁
                  ${escapeHtml(
                    event.baths
                  )}
                </span>
              `
              : ""
          }
          ${
            event.agent
              ? `
                <span>
                  👤
                  ${escapeHtml(
                    event.agent
                  )}
                </span>
              `
              : ""
          }
        </div>
        <div class="actions">
          <a
            href="${mapsUrl}"
            target="_blank"
            rel="noopener">
            Navigate
          </a>
          ${
            reaUrl
              ? `
                <a
                  class="rea"
                  href="${escapeHtml(
                    reaUrl
                  )}"
                  target="_blank"
                  rel="noopener">
                  View REA
                </a>
              `
              : ""
          }
        </div>
      </article>
    `;
  });
  app.innerHTML =
    html;
}
/* =========================================================
   LIVE CLOCK
========================================================= */
function updateClock() {
  const formatted =
    new Intl.DateTimeFormat(
      "en-AU",
      {
        timeZone: TIMEZONE,
        weekday: "long",
        day: "numeric",
        month: "long",
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      }
    ).format(
      new Date()
    );
  document
    .getElementById("clock")
    .textContent =
      formatted +
      " · Melbourne";
  /*
    Re-render so an open home
    disappears immediately after
    its end time.
  */
  if (events.length) {
    render();
  }
}
/* =========================================================
   TAB CONTROLS
========================================================= */
document
  .querySelectorAll(
    ".tabs button"
  )
  .forEach(button => {
    button.onclick =
      function() {
        view =
          this.dataset.view;
        render();
      };
  });
/* =========================================================
   REFRESH BUTTON
========================================================= */
document
  .getElementById("refresh")
  .onclick =
    loadCsv;
/* =========================================================
   GOOGLE SHEET BUTTON
========================================================= */
document
  .getElementById("source")
  .onclick =
    function() {
      window.open(
        SHEET_URL,
        "_blank"
      );
    };
/* =========================================================
   START APP
========================================================= */
loadCsv();
updateClock();
/*
  Update clock every second.
*/
setInterval(
  updateClock,
  1000
);
/*
  Re-sync Google Sheet every
  five minutes.
*/
setInterval(
  loadCsv,
  5 * 60 * 1000
);
</script>
</body>
</html>
